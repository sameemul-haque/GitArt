<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Examples - GitArt</title>
  <meta name="description"
    content="Contribution graphs drawn with GitArt: names, words and pixel art made from real git commits." />
  <link rel="canonical" href="https://gitart.pages.dev/examples" />
  <meta name="robots" content="index,follow" />

  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geo&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/examples.css" />
</head>

<body>
  <header>
    <a href="/" class="brand"><img class="logo-gitart" src="assets/logo.svg" alt="Logo" />GitArt</a>
  </header>

  <main class="examples">
    <h1>Examples</h1>
    <p class="examples-intro">
      Contribution graphs drawn with GitArt. Type a word or click the squares, generate the commands,
      and your profile can look like one of these.
    </p>

    <div class="example-list">
      <figure>
        <img src="assets/examples/hello.png" alt="GitHub contribution graph spelling HELLO :)" class="example-pic"
          width="753" height="167">
        <figcaption>hello :)</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/gitart.png" alt="GitHub contribution graph spelling GITART" class="example-pic"
          width="751" height="166" loading="lazy">
        <figcaption>gitart</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/sameemul.png" alt="GitHub contribution graph spelling SAMEEMUL" class="example-pic"
          width="750" height="167" loading="lazy">
        <figcaption>sameemul</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/i_use_arch_btw.png" alt="GitHub contribution graph spelling I USE ARCH BTW"
          class="example-pic" width="753" height="167" loading="lazy">
        <figcaption>i use arch btw</figcaption>
      </figure>
      <!-- <figure>
        <img src="assets/examples/your_image.png" alt="your image" class="example-pic" width="750" height="167" loading="lazy">
        <figcaption>your image</figcaption>
      </figure> -->
    </div>

    <a href="/" class="underline-text">Make your own</a>
  </main>
</body>

</html>
