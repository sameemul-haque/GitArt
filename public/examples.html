<body>
  <header>
    <a href="/" class="brand"><img class="logo-gitart" src="assets/logo.svg" alt="" width="100" height="100" />GitArt</a>
  </header>

  <main class="examples">
    <h1>Examples</h1>
    <p class="examples-intro">
      Contribution graphs drawn with GitArt. Type a word or click the squares, generate the commands,
      and your profile can look like one of these.
    </p>

    <div class="example-list">
      <figure>
        <img src="assets/examples/hello.png" alt="GitHub contribution graph spelling HELLO :)" class="example-pic"
          width="753" height="167">
        <figcaption>hello :)</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/gitart.png" alt="GitHub contribution graph spelling GITART" class="example-pic"
          width="751" height="166" loading="lazy">
        <figcaption>gitart</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/sameemul.png" alt="GitHub contribution graph spelling SAMEEMUL" class="example-pic"
          width="750" height="167" loading="lazy">
        <figcaption>sameemul</figcaption>
      </figure>
      <figure>
        <img src="assets/examples/i_use_arch_btw.png" alt="GitHub contribution graph spelling I USE ARCH BTW"
          class="example-pic" width="753" height="167" loading="lazy">
        <figcaption>i use arch btw</figcaption>
      </figure>

    </div>

    <a href="/" class="underline-text">Make your own</a>
